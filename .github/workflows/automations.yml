name: Automations

# Twice-daily business automations. Vercel's Hobby cron is daily-only, so this
# workflow provides a second run. Stages are claimed once in the
# automation_claims ledger, so extra/overlapping runs are safe.
on:
  schedule:
    - cron: '0 5,11 * * *' # 08:00 and 14:00 EAT (UTC+3)
  workflow_dispatch:

concurrency:
  group: automations
  cancel-in-progress: false

jobs:
  run:
    name: Run scheduled automations
    runs-on: ubuntu-latest
    steps:
      - name: Trigger automation endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the SITE_URL repository variable and CRON_SECRET repository secret."
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/automations/run?job=all")
          cat response.json
          if [ "$status" != "200" ]; then
            echo "::error::Automation endpoint returned HTTP $status"
            exit 1
          fi
